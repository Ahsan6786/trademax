<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0B0E14" id="theme-color-meta" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRADEMAX" />

    <title>TRADEMAX — Trading Education, Reimagined</title>
    <link rel="icon" type="image/png" href="/tm-logo.png" />
    <link rel="apple-touch-icon" href="/tm-logo.png" />
    <link rel="manifest" href="/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Zero-Flash Theme Initializer -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('tm_theme') || localStorage.getItem('tm_course_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', saved);
          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', saved === 'dark' ? '#0B0E14' : '#FFFFFF');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script src="/lottie.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
